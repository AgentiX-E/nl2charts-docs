name: POC reproduction

on:
  push:
    branches: [main]
    paths: ['poc/**', '*.md', '.github/workflows/poc.yml']
  pull_request:
    paths: ['poc/**', '*.md', '.github/workflows/poc.yml']
  workflow_dispatch:
    inputs:
      group:
        description: 'Which POC group to run'
        type: choice
        options: [deterministic, duckdb, llm, browser, all]
        default: deterministic

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  # ---------- always-on: document invariants ----------
  static:
    name: docs invariants (POC-25/35/39/40)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: POC-56 preflight (portable paths, live entries, current constants)
        run: python3 poc/56/preflight.py

      - name: POC-25 terminology lint (must be zero)
        run: python3 poc/25/check_terms.py

      - name: POC-35 POC completeness
        run: |
          python3 poc/35/check_poc.py > /tmp/p35.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/p35.json'))
          assert d['P1_index_matches_sections'], d
          a, b = d['P2_pass_rate'].split('/')
          assert a == b, d
          assert d['sections'] == 56, d
          assert d['P4_assumption_rows'] == 76, d
          print('POC-35 ok:', d['sections'], 'sections,', d['P2_pass_rate'], 'five-part,', d['P4_assumption_rows'], 'assumptions')
          PY

      - name: POC-39 eight-requirement audit
        run: |
          python3 poc/39/audit.py > /tmp/p39.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/p39.json'))
          assert d['adr']['missing_numbers'] == [], d['adr']
          assert d['sections']['duplicates'] == [], d['sections']
          assert d['gates']['missing_family_mapping'] == [], d['gates']
          assert d['claims_unsourced']['sections_with_shixce_but_no_ref'] == 0, d['claims_unsourced']
          print('POC-39 ok:', d['adr']['defined'], 'ADRs,', d['gates']['defined'], 'gates,', d['sections']['count'], 'sections')
          PY

      - name: POC-40 reproducibility fixture
        run: |
          python3 poc/40/poc-suite.py --check | tee /tmp/p40.txt
          grep -q '16/16 PASS' /tmp/p40.txt

  # ---------- always-on: deterministic experiments ----------
  deterministic:
    name: deterministic POCs (2/3/41-55)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: verify offline toolchain (no npm registry access on runners)
        run: |
          chmod +x node_modules/@esbuild/linux-x64/bin/esbuild
          node -e "import('esbuild').then(m => console.log('esbuild', m.version))"

      - name: POC-41 single package, two runtimes
        working-directory: poc/41
        run: |
          node bundle.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('bundle.json'))
          assert d['browser-core-only']['ok'] is True, d
          assert d['browser-core-only']['hasPg'] is False, d
          assert d['browser-core-only']['hasNodeBuiltin'] is False, d
          assert d['browser-core-plus-pg']['ok'] is False, d
          assert d['node-core-plus-pg']['ok'] is True, d
          print('POC-41 ok: browser root =', d['browser-core-only']['bytes'], 'B; pg from root fails as expected')
          PY

      - name: POC-42 admin handler is framework-agnostic
        working-directory: poc/42
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          rows = json.load(open('admin.json'))
          assert len(rows) == 4, rows
          for r in rows:
              assert r['direct'] == r['hono'] == r['http'], r
              assert r['sameBody'] is True, r
          print('POC-42 ok: 4/4 cases identical across node:http, Hono, direct')
          PY

      - name: POC-43 tree-shaking holds
        working-directory: poc/43
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('shake.json'))
          assert d['one-symbol']['bytes'] < 200, d
          assert d['namespace']['bytes'] > 10000, d
          print('POC-43 ok:', d['one-symbol']['bytes'], 'B vs', d['namespace']['bytes'], 'B')
          PY

      - name: POC-44 SQLite is not a first-class engine
        working-directory: poc/44
        run: |
          node --experimental-sqlite run_sqlite.cjs > /tmp/p44.txt 2>/dev/null
          grep -q '8/25' /tmp/p44.txt || (cat /tmp/p44.txt; exit 1)
          python3 - <<'PY'
          import json
          d = json.load(open('sqlite.json'))
          ok = sum(1 for r in d['results'] if r['ok'])
          assert ok == 8, ok
          print('POC-44 ok: SQLite executes', ok, 'of', len(d['results']), 'metric SQL forms')
          PY

      - name: POC-2 chart output renders
        working-directory: poc/02
        run: |
          node main.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          assert len(d['cases']) == 6, d
          assert all(c['render_ok'] for c in d['cases']), d
          assert d['stack_flag_ignored'] is True, d
          print('POC-2 ok: 6/6 charts render; chart_spec.stack ignored')
          PY

      - name: POC-45 single package vs three packages
        working-directory: poc/45
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          s = d['summary']
          assert s['identicalBytes'] is True, s
          assert s['baselineGreen'] is True, s
          assert s['mutationsCaught'] == s['mutationsTotal'] == 7, s
          print('POC-45 ok: 0-byte delta between layouts; 7/7 mutations caught')
          PY

      - name: POC-46 two copies of core
        working-directory: poc/46
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          s = d['summary']
          assert s['pass'] == s['total'] == 7, s
          assert s['brandSurvives'] and s['naiveRegistrySplits'] and s['sharedRegistryWorks'], s
          print('POC-46 ok: brand survives, naive registry splits, shared registry works')
          PY

      - name: POC-47 browser tiering over plain HTTP
        working-directory: poc/47
        run: |
          node run.mjs
          node survey.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          s = d['summary']
          assert s['pass'] == s['total'] == 14, s
          assert s['zeroNodeDeps'] is True, s
          assert s['endToEnd'] and s['guardHolds'], s
          assert s['browserImports'] == [], s
          v = json.load(open('survey.json'))['summary']
          assert v['portable'] == 9 and v['nodeOnly'] == 5, v
          assert v['connectorOnlyHypothesisHolds'] is False, v
          print('POC-47 ok:', s['browserBundleBytes'], 'B browser tier,',
                '5 node-only modules in', len(v['classes']), 'classes')
          PY

      - name: POC-48 split only the Node side
        working-directory: poc/48
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))['summary']
          assert d['coreSurfaceCleanA'] > 0, d
          assert d['coreSurfaceCleanB'] == 0, d
          assert d['structuralGuarantee'] is True, d
          assert d['peerDriversInCore']['A'] == 4 and d['peerDriversInCore']['B'] == 1, d
          assert d['extraInstallsForBrowser'] == 0, d
          print('POC-48 ok: core unusable surface', d['coreSurfaceCleanA'], '->', d['coreSurfaceCleanB'])
          PY

      - name: POC-49 SQL-first without any model
        working-directory: poc/49
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          s = d['summary']
          assert s['pass'] == s['total'] == 16, s
          assert s['sqlOnlyNeedsAI'] is False, s
          assert s['coreImports'] == [], s
          assert s['coreBytes'] < 2000, s
          print('POC-49 ok: core', s['coreBytes'], 'B with zero AI imports')
          PY

      - name: POC-50 embedding providers and degradation
        working-directory: poc/50
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          s = d['summary']
          assert s['pass'] == s['total'] == 17, s
          assert s['providerAgnostic'] is True, s
          assert s['degradesWithoutCrash'] is True, s
          assert s['providersTested'] == ['local', 'api', 'none'], s
          print('POC-50 ok:', len(s['providersTested']), 'providers, degradation holds')
          PY

      - name: POC-51 LLM and embedding share one provider model
        working-directory: poc/51
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          s = d['summary']
          assert s['pass'] == s['total'] == 17, s
          assert s['programmatic'] is True, s
          assert s['singleMethodContract'] == ['complete'], s
          assert len(s['llmProviders']) == 4, s
          print('POC-51 ok:', len(s['llmProviders']), 'llm providers,',
                len(s['embeddingProviders']), 'embedding providers')
          PY

      - name: POC-52 HITL session state
        working-directory: poc/52
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          sc = d['scenarios']
          assert sc['appendOnly']['correct'] == 6, d
          assert sc['intentState']['correct'] == 12, d
          assert len(sc['driftFailuresAppendOnly']) == 6, d
          assert d['resume']['ok'] == d['resume']['total'] == 12, d
          assert sum(1 for r in d['illegalTransitions'] if r['rejected']) == 4, d
          assert d['ordering']['fixed']['wasted'] == 5, d
          assert d['ordering']['dependency']['wasted'] == 0, d
          print('POC-52 ok: intent', sc['intentState']['correct'], '/', sc['total'],
                'append-only', sc['appendOnly']['correct'], '/', sc['total'])
          PY

      - name: POC-53 observability contract
        working-directory: poc/53
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          sv = d['schemaSurvival']
          assert sv['v1.30 (2025-04)']['valid'] == 4, sv
          assert sv['v1.40 (2026-02)']['valid'] == 8, sv
          assert sv['v1.43+ (2026-07, genai repo)']['valid'] == 12, sv
          for k, v in d['dashboards']['oldDashboards_on_ourTable'].items():
              assert v == '0/1', (k, v)
          for k, v in d['dashboards']['ourDashboards_on_oldTable'].items():
              assert v == '0/1', (k, v)
          assert d['pii']['raw_leaks'] == 3, d['pii']
          assert d['pii']['hash_leaks'] == 0, d['pii']
          assert d['traceCompleteness']['identical'] is True, d['traceCompleteness']
          print('POC-53 ok: survival 4/8/12, pii 3->0, trace identical')
          PY

      - name: POC-54 connector SPI and key reconciliation
        working-directory: poc/54
        run: |
          node run.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          assert d['core']['unchangedDuringOnboarding'] is True, d['core']
          assert len(d['surface']['requiredMethods']) == 2, d['surface']
          inc = d['incremental']
          assert inc['missingRows'] == 100 and inc['incremental']['rows'] == 100, inc
          assert inc['byteRatio'] < 0.30, inc
          kr = d['keyReconciliation']
          assert kr['merkleBinary']['ratio'] < 0.06, kr
          assert kr['bucketDigest']['ratio'] > 0.90, kr
          assert len(d['failureModes']) == 3, d['failureModes']
          print('POC-54 ok: incremental', inc['byteRatio'], 'of full bytes; merkle',
                kr['merkleBinary']['ratio'], 'of manifest')
          PY

      - name: POC-55 explicit chart spec without a model
        working-directory: poc/55
        run: |
          node spec.mjs > /dev/null
          node bundle.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('results.json'))
          assert d['summary']['rendered'] == '5/5', d['summary']
          assert d['summary']['jsonReplay'] == '5/5', d['summary']
          assert d['summary']['rejected'] == '6/6', d['summary']
          b = json.load(open('bundle.json'))
          assert b['gzip'] < 4000, b
          assert b['importsCore'] == [], b
          assert b['hasAiSdk'] is False and b['hasNodeBuiltin'] is False, b
          print('POC-55 ok:', b['gzip'], 'B gzip, 0 core/ai imports')
          PY

      - name: POC-3 compile latency budget
        working-directory: poc/03
        run: |
          node main.mjs
          python3 - <<'PY'
          import json
          d = json.load(open('latency.json'))
          assert d['p95'] < 3.0, d
          print('POC-3 ok: p50', d['p50'], 'ms, p95', d['p95'], 'ms')
          PY

  # ---------- always-on: pure-python statistics ----------
  python-stats:
    name: python-only POCs (27/28/36/37/38)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install numpy
        run: python3 -m pip install --quiet numpy

      - name: run
        run: |
          (cd poc/27 && python3 gate_audit.py > /tmp/p27.txt)
          (cd poc/28 && python3 main.py       > /tmp/p28.txt)
          (cd poc/36 && python3 evalplan.py   > /tmp/p36.txt)
          (cd poc/37 && python3 main.py       > /tmp/p37.txt)
          (cd poc/38 && python3 main.py       > /tmp/p38.txt)
          for p in 27 28 36 37 38; do test -s /tmp/p$p.txt || (echo "POC-$p produced no output"; exit 1); done

  # ---------- manual: PostgreSQL + DuckDB native ----------
  duckdb:
    name: PostgreSQL backend (manual)
    if: github.event_name == 'workflow_dispatch' && (inputs.group == 'duckdb' || inputs.group == 'all')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: analytics
          POSTGRES_USER: t2c
          POSTGRES_PASSWORD: t2cpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U t2c -d analytics"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: seed PostgreSQL
        env:
          PGPASSWORD: t2cpass
        run: |
          psql -h 127.0.0.1 -U t2c -d analytics -v ON_ERROR_STOP=1 -c "
          CREATE TABLE orders(id int primary key, region text, amount numeric(12,2),
                              status text, created_at timestamptz default now());
          INSERT INTO orders(id, region, amount, status, created_at)
            SELECT i, (ARRAY['east','west','north'])[1 + i % 3], (i * 7 % 1000) / 10.0,
                   CASE WHEN i % 4 = 0 THEN 'open' ELSE 'paid' END,
                   now() - (i || ' hours')::interval
            FROM generate_series(1, 1000) i;"

      - name: POC-12 attach PostgreSQL and prove pushdown
        working-directory: poc/12
        run: |
          python3 - <<'PY'
          import sqlite3
          c = sqlite3.connect('small.sqlite')
          c.execute('create table if not exists region_dim(id integer, owner text)')
          c.executemany('insert into region_dim values (?,?)', [(i, 'o%d' % i) for i in range(1, 21)])
          c.commit(); c.close()
          PY
          node main.js

  # ---------- manual: LLM-backed ----------
  llm:
    name: LLM-backed POCs (manual, needs secret)
    if: github.event_name == 'workflow_dispatch' && (inputs.group == 'llm' || inputs.group == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: guard - secret must be present
        run: |
          if [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "::error::DEEPSEEK_API_KEY is not configured; refusing to run LLM POCs"
            exit 1
          fi

      - name: POC-7 / 8 / 9 / 18 / 30 smoke
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          pip install --quiet duckdb==1.5.6 requests numpy scipy jieba
          for p in 7 8 9 18 30; do
            echo "--- POC-$p"
            (cd poc/$p && python3 main.py) || exit 1
          done

  # ---------- manual: browser / OPFS ----------
  browser:
    name: Browser and OPFS (manual)
    if: github.event_name == 'workflow_dispatch' && (inputs.group == 'browser' || inputs.group == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install Playwright + Chromium
        run: |
          pip install --quiet playwright duckdb
          python3 -m playwright install --with-deps chromium

      - name: POC-6 OPFS persistence across restart
        working-directory: poc/06
        run: python3 opfs_test.py
