version: v5.22
# The evaluation plan is the machine-readable half of §5/§8.19. Every benchmark we
# quote must appear here with n, metric, grader and evidence; every measured row
# must carry a baseline and a POC that produced it. `poc/73/check.py` enforces it.
benchmarks:
  - id: E1
    name: BIRD Mini-Dev (SQLite)
    dataset: birdsql/bird_mini_dev
    n: 500
    metric: execution match (set semantics, order ignored)
    grader: own
    evidence: "off"
    provider: deepseek
    status: measured
    baseline: 0.466
    result: 0.496
    target: relative +3pp over same-model zero-shot (achieved +3.00pp)
    gate: BIRD1
    evidencePoc: POC-68
    notes: 5 samples + two-stage repair; zero-shot baseline 46.6%

  - id: E2
    name: nvBench 2.0 dev (chart type)
    dataset: HKUSTDial/nvBench-2.0 (blob f37c5844, not vendored)
    n: 750
    metric: top-1 mark against any gold mark
    grader: own (not the official metric)
    evidence: n/a
    provider: deepseek
    status: measured
    baseline: null
    result: 0.9173
    target: "overall >=85%; queries that do not name the chart >=75%"
    gate: LEVER1
    evidencePoc: POC-71
    notes: rule arm 91.73%, LLM 90.67%; unnamed subset 74.35%/75.22%

  - id: E3
    name: Text2Vis (text-to-chart)
    dataset: mizanurr/Text2Vis
    datasetProbe: poc/75/probe.json
    datasetVerified: 2026-10-19
    n: 1985
    metric: answer match + chart-type match against the per-row gold
    grader: own
    evidence: n/a
    provider: deepseek
    status: planned
    baseline: null
    result: null
    target: ">=50% answer match"
    gate: CHART1
    evidencePoc: POC-71
    unblock: run the CPU-only harness on the CSV; the file carries Answer, Visualization Code and Chart Type per row
    notes: "6.7 MB, single CSV; the earlier 'no public copy' was never searched for (POC-75)"


  - id: E4
    name: BIRD-Interact Lite (c-Interact)
    dataset: birdsql/bird-interact-lite
    datasetProbe: poc/75/probe.json
    datasetVerified: 2026-10-19
    n: 300
    metric: P1 (accuracy) + P2 (efficiency)
    grader: official
    evidence: n/a
    provider: deepseek
    status: blocked
    baseline: null
    result: null
    target: P1 >=54%, P2 >=40%
    gate: HITL1
    evidencePoc: null
    unblock: ground truth is withheld by design (sol_sql and test_cases ship empty; request by email with the tag [bird-interact-lite GT&Test Cases]); Lite targets PostgreSQL, so the harness needs a PG service, not SQLite
    notes: "the task texts are public and already fetched; the old 'gated on HF' claim was a wrong repo id returning 404 (POC-75)"

  - id: E6
    name: Spider2-Lite (SQLite subset)
    dataset: xlangai/spider2-lite + xlangai/spider2-localdb
    datasetProbe: poc/75/probe.json
    datasetVerified: 2026-10-19
    n: 260
    metric: execution match against the published gold result set
    grader: official (xlang-ai/Spider2 spider2-lite/evaluation_suite/gold)
    evidence: n/a
    provider: deepseek
    status: planned
    baseline: null
    result: null
    target: relative +3pp over same-model zero-shot on the SQLite subset
    gate: BIRD1
    evidencePoc: null
    unblock: download spider2-localdb/sqlite.zip (573 MB) and keep only the instances whose db is in that archive
    notes: "260 instances in total; the SQLite-subset count is measured after the archive is unpacked"


  - id: E5
    name: private adjudicated set
    dataset: internal
    n: 1300
    metric: adjudicated semantic execution match
    grader: own
    evidence: on
    provider: deepseek
    status: planned
    baseline: 0.833
    result: null
    target: paired delta >=5pp with McNemar p<0.05
    gate: EV1
    evidencePoc: POC-30
    unblock: adjudication round with two annotators (kappa >=0.7)

# Objectives we are deliberately NOT pursuing in the design/POC phase. Recorded
# here (not in prose) so they cannot quietly disappear or quietly become
# commitments. Each one names why it is deferred and what would bring it back.
deferred:
  - id: SOTA-ABS
    goal: BIRD Mini-Dev >=52-62% (absolute); BIRD test >=75%
    reason: requires a fine-tuned generator or oracle evidence; both are outside the product constraint (CPU inference, no fine-tuning) and outside the current scope (docs + POC)
    revisit: development phase, only if a cloud fine-tuning route is approved; until then E1 is judged on the relative target (+3pp over same-model zero-shot)
  - id: FINE-TUNE
    goal: a fine-tuned text-to-SQL generator (SFT/RL on BIRD train)
    reason: training pipeline, data licensing and compute are a separate project; no impact on inference-side CPU-only requirement
    revisit: after M-B, with a budget and a data-licensing review
