version: v5.28
# The evaluation plan is the machine-readable half of §5/§8.19. Every benchmark we
# quote must appear here with n, metric, grader and evidence; every measured row
# must carry a baseline and a POC that produced it. `poc/73/check.py` enforces it.
benchmarks:
  - id: E1
    name: BIRD Mini-Dev (SQLite)
    dataset: birdsql/bird_mini_dev
    n: 500
    metric: execution match (set semantics, order ignored)
    grader: own
    evidence: "off"
    provider: deepseek
    status: measured
    baseline: 0.466
    result: 0.496
    target: relative +3pp over same-model zero-shot (achieved +3.00pp)
    gate: BIRD1
    evidencePoc: POC-68
    engine: sqlite3 (stdlib)
    notes: "5 samples + two-stage repair; zero-shot baseline 46.6%. Engine-pinned: on DuckDB the same predictions score 46.39% and 21.1% of gold does not run at all (POC-78)"

  - id: E2
    name: nvBench 2.0 dev (chart type)
    dataset: HKUSTDial/nvBench-2.0 (blob f37c5844, not vendored)
    n: 750
    metric: top-1 mark against any gold mark
    grader: own (not the official metric)
    evidence: n/a
    provider: deepseek
    status: measured
    baseline: null
    result: 0.9173
    target: "overall >=85%; queries that do not name the chart >=75%"
    gate: LEVER1
    evidencePoc: POC-71
    notes: rule arm 91.73%, LLM 90.67%; unnamed subset 74.35%/75.22%

  - id: E3
    name: Text2Vis (text-to-chart)
    dataset: mizanurr/Text2Vis
    datasetProbe: poc/75/probe.json
    datasetVerified: 2026-10-19
    n: 1985
    metric: answer match + chart-type match against the per-row gold
    grader: own
    evidence: n/a
    provider: deepseek
    status: measured
    baseline: 0.3365
    result: 0.4494
    target: "chart top-1 >=45%; answer match >=50%"
    gate: CHART1
    evidencePoc: POC-76
    notes: "1985 rows, $0.2107, own grader. chart 44.94% vs rule 33.65%; answer 29.09%; joint 13.81%; unanswerable recall 96.89%, false abstain 19.49%. Answer accuracy is the bottleneck, not chart choice (ADR-147)"


  - id: E4
    name: BIRD-Interact Lite (c-Interact)
    dataset: birdsql/bird-interact-lite
    datasetProbe: poc/75/probe.json
    datasetVerified: 2026-10-19
    n: 300
    metric: P1 (accuracy) + P2 (efficiency)
    grader: official
    evidence: n/a
    provider: deepseek
    status: reference
    baseline: null
    result: null
    target: not a gate; recorded so the option stays visible
    gate: null
    evidencePoc: null
    reason: "CRUD tasks need assertion-type gold (sol_sql/test_cases), which is withheld by design; and the c/a-Interact protocol plus user simulator are the authors' product assumptions, not ours (ADR-150, section 8.36). PG itself is still verified, as a cross-engine consistency fixture (E7), not as a leaderboard"
    notes: "the 300 task texts are public and already fetched; 6 of them carry external_knowledge references"

  - id: E7
    name: cross-engine gold consistency
    dataset: birdsql/bird_mini_dev (500 gold SQL)
    datasetProbe: poc/75/probe.json
    n: 492
    metric: share of gold statements that run on >=2 engines; share of verdicts that agree
    grader: own
    evidence: "off"
    provider: none
    status: measured
    baseline: 1.0
    result: 0.982
    target: "verdict agreement >=97% per engine pair (baseline 1.0 = same engine twice); report un-runnable share and silent divergences separately"
    gate: EV9
    evidencePoc: POC-78
    engines: "sqlite3 3.x, DuckDB 1.5.6, PostgreSQL 17 (PGlite 0.2, WASM)"
    guard: "poc/80/guard.py: 6 hard rules + 2 warn; on 132 comparable questions precision 100%, recall 60%, refusal 2.27% (POC-80)"
    notes: "sqlite<->duckdb: gold 78.9% runnable, self-consistency 98.2%, verdict 97.68%, 5 silent (1.3%). sqlite<->pg: gold 94.29% runnable, 96.21%, verdict 99.19%, 5 silent (3.8%). Two engines disagree with themselves at different rates, and PG drifts silently more often (POC-78/79, ADR-149/151)"

  - id: E8
    name: connector contract (PostgreSQL)
    dataset: none (assertions, not a benchmark)
    n: 12
    metric: assertions passed, split into gate (adapter bug) and obligation (host responsibility)
    grader: own
    evidence: n/a
    provider: none
    status: measured
    baseline: 12
    result: 12
    target: "8/8 gate assertions pass on both backends; every unmet obligation has a named owner"
    gate: XCONN1
    evidencePoc: POC-81
    notes: "Two backends, same 12 assertions. PGlite: 6/6 gates, 3 cluster skipped, statement_timeout NOT enforced (601ms vs 100ms). Real postgres:16 service container in CI: 0 skipped, 8/8 gates pass, statement_timeout aborts at 101ms, pg.Pool leaks search_path across checkouts (adapter must RESET ALL), RLS filters correctly as a non-superuser. On CI the collation actually forks: default collation orders a,Á,B,c while COLLATE \"C\" orders B,a,c,Á, so the chart axis order depends on the server. The 30s job is always-on; the two backends disagree in opposite directions on timeouts, which is why both run"

  - id: E6
    name: Spider2-Lite (SQLite subset)
    dataset: xlangai/spider2-lite + xlangai/spider2-localdb
    datasetProbe: poc/75/probe.json
    datasetVerified: 2026-10-19
    n: 260
    metric: execution match against the published gold result set
    grader: official (xlang-ai/Spider2 spider2-lite/evaluation_suite/gold)
    evidence: n/a
    provider: deepseek
    status: measured
    baseline: 0.20
    result: 0.20
    target: "hold >=20% on the SQLite subset while cutting prompt size"
    gate: EV8
    evidencePoc: POC-77
    notes: "40 instances with a local sqlite db (median 76 cols, max 352). full 20.0% vs linked 17.5%, McNemar p=1.000; prompt 2312 -> 1144 chars (-50.5%); three full runs 20.0/17.5/22.5%, one question = 2.5pp (ADR-148)"


  - id: E5
    name: private adjudicated set
    dataset: internal
    n: 1300
    metric: adjudicated semantic execution match
    grader: own
    evidence: on
    provider: deepseek
    status: planned
    baseline: 0.833
    result: null
    target: paired delta >=5pp with McNemar p<0.05
    gate: EV1
    evidencePoc: POC-30
    unblock: adjudication round with two annotators (kappa >=0.7)

# Objectives we are deliberately NOT pursuing in the design/POC phase. Recorded
# here (not in prose) so they cannot quietly disappear or quietly become
# commitments. Each one names why it is deferred and what would bring it back.
deferred:
  - id: SOTA-ABS
    goal: BIRD Mini-Dev >=52-62% (absolute); BIRD test >=75%
    reason: requires a fine-tuned generator or oracle evidence; both are outside the product constraint (CPU inference, no fine-tuning) and outside the current scope (docs + POC)
    revisit: development phase, only if a cloud fine-tuning route is approved; until then E1 is judged on the relative target (+3pp over same-model zero-shot)
  - id: FINE-TUNE
    goal: a fine-tuned text-to-SQL generator (SFT/RL on BIRD train)
    reason: training pipeline, data licensing and compute are a separate project; no impact on inference-side CPU-only requirement
    revisit: after M-B, with a budget and a data-licensing review
